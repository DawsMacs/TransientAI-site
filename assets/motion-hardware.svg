<title>A point-drawn laptop with a processor, memory, and passing activity</title>
<style>
:root { color: #ececee; --accent: #b4cdff; --surface: #09090a; }
@media (prefers-color-scheme: light) { :root { color: #131316; --accent: #1c4fd1; --surface: #f2f2f4; } }
.dot-path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0 6; }
.accent { color: var(--accent); }
.signal { opacity: .65; animation: signal 8s ease-in-out infinite; animation-delay: var(--delay, 0s); }
@keyframes signal { 0%, 10%, 90%, 100% { opacity: .16; } 32%, 52% { opacity: .95; } 72% { opacity: .35; } }
.transfer { animation: transfer 6s ease-in-out infinite; }
@keyframes transfer { 0%, 12% { opacity: 0; transform: translateX(0); } 22% { opacity: .9; } 70% { opacity: .9; } 84%, 100% { opacity: 0; transform: translateX(68px); } }
.beacon { transform-box: fill-box; transform-origin: center; opacity: .4; animation: beacon 7s ease-out infinite; }
@keyframes beacon { 0%, 15% { opacity: .1; transform: scale(.9); } 45% { opacity: .65; transform: scale(1); } 80%, 100% { opacity: .1; transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
